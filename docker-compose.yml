services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prospect_vinceai
    ports: ["5432:5432"]
    volumes: [prospect_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prospect_vinceai"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  prospect_pgdata:
